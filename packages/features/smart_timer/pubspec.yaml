name: smart_timer
description: A smart multi-timer for overlapping lab protocols.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.3.3
  intl: any
  database:
    path: ../../core/database
  localization:
    path: ../../core/localization

  ui_kit:

    path: ../ui_kit
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.9
  flutter_lints: ^2.0.0
