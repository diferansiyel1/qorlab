name: in_vitro
description: In-Vitro chemistry tools including chemical inventory and calculators.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  decimal: ^2.3.3
  ui_kit:
    path: ../ui_kit
  premium_access:
    path: ../../core/premium_access
  math_engine:
    path: ../../core/math_engine
  localization:
    path: ../../core/localization
  database:
    path: ../../core/database
  mobile_scanner: ^7.1.2
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  assets:
    - assets/chemicals.json
